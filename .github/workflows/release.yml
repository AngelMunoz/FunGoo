name: Create Release

on:
  workflow_dispatch:

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Extract Release Data
        id: extract
        run: |
          VERSION_LINE=$(grep -n "^## \[[0-9]" CHANGELOG.md | head -n 1)

          if [ -z "$VERSION_LINE" ]; then
            echo "No version found in CHANGELOG.md"
            exit 1
          fi

          LINE_NUM=$(echo "$VERSION_LINE" | cut -d: -f1)
          VERSION=$(echo "$VERSION_LINE" | sed -E 's/.*## \[([^]]+)\].*/\1/')

          echo "Found version: $VERSION at line $LINE_NUM"

          NEXT_HEADER_LINE=$(tail -n +$((LINE_NUM + 1)) CHANGELOG.md | grep -n "^## \[" | head -n 1 | cut -d: -f1)

          if [ -z "$NEXT_HEADER_LINE" ]; then
            BODY=$(tail -n +$((LINE_NUM + 1)) CHANGELOG.md)
          else
            BODY=$(tail -n +$((LINE_NUM + 1)) CHANGELOG.md | head -n $((NEXT_HEADER_LINE - 1)))
          fi

          echo "$BODY" > RELEASE_NOTES.md

          echo "version=$VERSION" >> $GITHUB_OUTPUT

          if echo "$VERSION" | grep -qiE '(alpha|beta|rc)'; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Check if Tag Exists
        id: check_tag
        run: |
          if git rev-parse "v${{ steps.extract.outputs.version }}" >/dev/null 2>&1; then
            echo "Tag v${{ steps.extract.outputs.version }} already exists."
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup .NET
        if: steps.check_tag.outputs.exists == 'false'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install dotnet tools
        if: steps.check_tag.outputs.exists == 'false'
        run: dotnet tool restore

      - name: Install shader SDKs (Slang 2026.16 + Vulkan SDK 1.4.357.0)
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          set -euo pipefail
          SDK_ROOT="$RUNNER_TEMP/shader-sdks"
          mkdir -p "$SDK_ROOT"
          curl -sSL -o "$SDK_ROOT/slang.tar.gz" https://github.com/shader-slang/slang/releases/download/v2026.16/slang-2026.16-linux-x86_64-glibc-2.27.tar.gz
          mkdir -p "$SDK_ROOT/slang"
          tar -xzf "$SDK_ROOT/slang.tar.gz" -C "$SDK_ROOT/slang"
          git clone --depth 1 --branch vulkan-sdk-1.4.357.0 https://github.com/KhronosGroup/SPIRV-Tools.git "$SDK_ROOT/SPIRV-Tools"
          test "$(git -C "$SDK_ROOT/SPIRV-Tools" rev-parse HEAD)" = "9a49b0883b9b635689a85b5647dbfcb223268151"
          git init "$SDK_ROOT/SPIRV-Tools/external/spirv-headers"
          git -C "$SDK_ROOT/SPIRV-Tools/external/spirv-headers" remote add origin https://github.com/KhronosGroup/SPIRV-Headers.git
          git -C "$SDK_ROOT/SPIRV-Tools/external/spirv-headers" fetch --depth 1 origin 29981f65241605e08b0ede4cfeb999fe3b723c6a
          git -C "$SDK_ROOT/SPIRV-Tools/external/spirv-headers" checkout --detach FETCH_HEAD
          cmake -S "$SDK_ROOT/SPIRV-Tools" -B "$SDK_ROOT/SPIRV-Tools-build" -G Ninja -DCMAKE_BUILD_TYPE=Release -DSPIRV_SKIP_TESTS=ON -DSPIRV_WERROR=OFF
          cmake --build "$SDK_ROOT/SPIRV-Tools-build" --target spirv-val --parallel 2
          mkdir -p "$SDK_ROOT/vulkan/bin"
          install -Dm755 "$SDK_ROOT/SPIRV-Tools-build/tools/spirv-val" "$SDK_ROOT/vulkan/bin/spirv-val"
          SLANG_BIN="$(dirname "$(find "$SDK_ROOT/slang" -name slangc -type f | head -n 1)")"
          VULKAN_BIN="$SDK_ROOT/vulkan/bin"
          echo "SLANG_SDK=$SLANG_BIN/.." >> $GITHUB_ENV
          echo "VULKAN_SDK=$(dirname "$VULKAN_BIN")" >> $GITHUB_ENV
          echo "$SLANG_BIN" >> $GITHUB_PATH
          echo "$VULKAN_BIN" >> $GITHUB_PATH
          slangc -version
          spirv-val --version | grep -F "SPIRV-Tools v2026.3 vulkan-sdk-1.4.357.0"

      - name: Restore dependencies
        if: steps.check_tag.outputs.exists == 'false'
        run: dotnet restore

      - name: Build
        if: steps.check_tag.outputs.exists == 'false'
        run: dotnet build --configuration Release --no-restore -p:CompileMetroShaders=true

      - name: Pack
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          dotnet pack --configuration Release --no-build --output nupkgs FunGoo/FunGoo.fsproj
          dotnet pack --configuration Release --no-build --output nupkgs FunGoo.Widgets/FunGoo.Widgets.fsproj
          dotnet pack --configuration Release --no-build --output nupkgs FunGoo.Mvu/FunGoo.Mvu.fsproj
          dotnet pack --configuration Release --no-build --output nupkgs -p:CompileMetroShaders=true FunGoo.Metro/FunGoo.Metro.fsproj

      - name: Consumer probe (Metro embedded shader, no SDK)
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          set -euo pipefail
          unset SLANG_SDK
          unset VULKAN_SDK
          PATH="$(echo "$PATH" | tr ':' '\n' | grep -viE 'slang|vulkan|shader-sdks' | paste -sd: -)"
          if command -v slangc >/dev/null 2>&1; then echo "slangc still on PATH"; exit 1; fi
          if command -v spirv-val >/dev/null 2>&1; then echo "spirv-val still on PATH"; exit 1; fi
          PROBE="$RUNNER_TEMP/metro-consumer"
          rm -rf "$PROBE"
          dotnet new console -lang "F#" -o "$PROBE" --no-restore
          METRO_NUPKG="$(ls "$GITHUB_WORKSPACE/nupkgs"/FunGoo.Metro.*.nupkg | head -n 1)"
          METRO_VERSION="$(basename "$METRO_NUPKG" | sed -E 's/^FunGoo\.Metro\.(.*)\.nupkg$/\1/')"
          echo "Probing FunGoo.Metro $METRO_VERSION from $METRO_NUPKG"
          dotnet add "$PROBE" package FunGoo.Metro --version "$METRO_VERSION" --source "$GITHUB_WORKSPACE/nupkgs" --source https://api.nuget.org/v3/index.json
          cat > "$PROBE/Program.fs" <<'EOF'
          open FunGoo.Metro

          printfn "isEmbeddedShaderAvailable=%b" MetroPerspective.isEmbeddedShaderAvailable

          if not MetroPerspective.isEmbeddedShaderAvailable then
              eprintfn "FAIL: Metro embedded shader is missing from the packed nupkg."
              exit 1
          EOF
          dotnet build "$PROBE" -v:n 2>&1 | tee "$RUNNER_TEMP/metro-consumer-build.log"
          if grep -iE 'ShaderEffectTool|GooShaderEffect' "$RUNNER_TEMP/metro-consumer-build.log"; then
            echo "FAIL: consumer build invoked the shader toolchain."
            exit 1
          fi
          dotnet run --project "$PROBE" --no-build

      - name: NuGet login (trusted publishing)
        if: steps.check_tag.outputs.exists == 'false'
        uses: NuGet/login@v1
        id: nuget_login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet
        if: steps.check_tag.outputs.exists == 'false'
        run: dotnet nuget push "nupkgs/*.nupkg" --api-key ${{ steps.nuget_login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create Release
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.extract.outputs.version }}
          name: v${{ steps.extract.outputs.version }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: ${{ steps.extract.outputs.prerelease }}
          files: nupkgs/*.nupkg
